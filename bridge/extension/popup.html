<!doctype html><meta charset="utf-8">
<style>
 body{font:12px/1.5 ui-monospace,Menlo,monospace;background:#0f1318;color:#e6ebf2;
      width:330px;margin:0;padding:14px}
 h1{font:600 14px ui-sans-serif,system-ui;margin:0 0 2px}
 .sub{color:#7c8896;font-size:11px;margin-bottom:12px}
 label{display:block;color:#7c8896;font-size:10px;margin:10px 0 3px;
       text-transform:uppercase;letter-spacing:.06em}
 input,select{width:100%;box-sizing:border-box;padding:7px 8px;border-radius:6px;
      border:1px solid #2b333d;background:#0a0d11;color:#e6ebf2;font:inherit;font-size:11px}
 button{width:100%;margin-top:12px;padding:8px;border-radius:6px;border:1px solid #c8442e;
      background:#c8442e;color:#fff;font:inherit;font-weight:600;cursor:pointer}
 .ghost{background:#151b22;border-color:#2b333d;color:#e6ebf2;font-weight:400;margin-top:6px}
 #msg{margin-top:10px;font-size:11px;white-space:pre-wrap;color:#5fd39a}
 .warn{color:#f08a7a;font-size:10px;margin-top:10px;line-height:1.5}
</style>
<h1>CELL</h1>
<div class="sub">airgapped signer &middot; no key in this browser</div>

<label>Address the device holds</label>
<input id="address" placeholder="0x…" spellcheck="false">

<label>Chain</label>
<select id="chainId">
  <option value="0x1">Ethereum mainnet (1)</option>
  <option value="0x2105">Base (8453)</option>
  <option value="0x14a34">Base Sepolia (84532)</option>
  <option value="0xaa36a7">Sepolia (11155111)</option>
</select>

<label>RPC</label>
<input id="rpcUrl" spellcheck="false">

<label>Device (mock only)</label>
<input id="deviceUrl" spellcheck="false">

<button id="save">Save</button>
<button id="probe" class="ghost">Probe device</button>
<div id="msg"></div>
<div class="warn">This build has no secure element. The seed is a file on the
Pi's SD card, so treat it as a hot wallet.</div>
<script src="popup.js"></script>
