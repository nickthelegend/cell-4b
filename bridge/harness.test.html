<!doctype html><meta charset="utf-8"><title>harness check</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:16px}</style>
<pre id="out">...</pre>
<script type="module">
import { encodeQR } from "./extension/lib/qr.js";
const out = document.getElementById("out");
function draw(matrix, scale = 8, quiet = 4) {
  const n = matrix.length, px = (n + quiet*2) * scale;
  const cv = document.createElement("canvas"); cv.width = cv.height = px;
  const g = cv.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,px,px); g.fillStyle="#000";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++)
    if (matrix[r][c]) g.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
  document.body.appendChild(cv);
  return cv;
}
const det = new BarcodeDetector({formats:["qr_code"]});
const ref = await (await fetch("./ref.json")).json();
const refRes = await det.detect(draw(ref));
out.textContent = `segno reference matrix -> ${JSON.stringify(refRes[0]?.rawValue ?? null)}\n`;
const mineRes = await det.detect(draw(encodeQR("HELLO", 0, 0)));
out.textContent += `my encoder            -> ${JSON.stringify(mineRes[0]?.rawValue ?? null)}\n`;
out.textContent += refRes.length ? "\nharness works -- the encoder is at fault"
                                 : "\nHARNESS IS BROKEN -- even a known-good matrix fails";
</script>
