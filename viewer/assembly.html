<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CELL-4B — assembly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff9d3c' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root{ --bg:#0b0d10; --ink:#eef2f7; --dim:#9aa4b2; --accent:#ff9d3c; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    color:var(--ink);font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
  canvas{display:block}
  #card{position:fixed;left:72px;bottom:84px;width:660px;padding:28px 32px 24px;
    border-radius:14px;background:rgba(8,10,13,.84);
    border:1px solid rgba(255,255,255,.10);border-left:4px solid var(--accent);
    opacity:0;transform:translateY(22px)}
  #part{font-size:38px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
  #detail{margin-top:14px;font-size:21px;color:var(--dim);line-height:1.4}
  #count{position:fixed;top:46px;right:56px;font:400 19px/1 ui-monospace,monospace;
    letter-spacing:.18em;color:var(--dim);opacity:0}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:var(--bg);z-index:5}
  #tbig{font-size:96px;font-weight:700;letter-spacing:-.035em}
  #tbig b{color:var(--accent);font-weight:700}
  #trule{height:3px;width:0;background:var(--accent);margin:24px 0 20px}
  #tsub{font-size:27px;color:var(--dim);opacity:0}
</style>
</head>
<body>
<div id="count"></div>
<div id="card"><div id="part"></div><div id="detail"></div></div>
<div id="title"><div id="tbig">CELL<b>-4B</b></div><div id="trule"></div>
  <div id="tsub">assembly, component by component</div></div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(34, W/H, 1, 6000);
camera.up.set(0,0,1);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1e24, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(160,-220,260);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.1); rim.position.set(-180,160,80);
scene.add(rim);
const grid = new THREE.GridHelper(520, 52, 0x232a33, 0x161b21);
grid.rotation.x = Math.PI/2; grid.position.z = -0.4; scene.add(grid);

const root = new THREE.Group(); scene.add(root);

const ease = t => t<0 ? 0 : t>1 ? 1 : 1-Math.pow(1-t, 3);          // outCubic
const easeIO = t => t<0 ? 0 : t>1 ? 1 : (t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2);
const lerp = (a,b,t) => a+(b-a)*t;

let MAN = null, SEG = [], TOTAL = 0, parts = new Map();

// Which nodes fly in during which narration scene, and where the camera sits.
// dist/target are absolute mm, same convention as the model.
const PLAN = [
  {id:'00_title', nodes:[],                     az:-58, el:34, dist:300, tgt:[0,-6,26]},
  {id:'01_pi',    nodes:['shell_lower','mock_pi4b'], az:-58, el:38, dist:255, tgt:[0,-6,22]},
  {id:'02_switch',nodes:['mock_switch'],        az:-96, el:30, dist:150, tgt:[8,-48,10]},
  {id:'03_baffle',nodes:['slot_baffle'],        az:-96, el:28, dist:150, tgt:[0,-50,10]},
  {id:'04_leds',  nodes:['optical_head','mock_led1','mock_ir','mock_led2'],
                  ghost:['optical_head'], az:-42, el:26, dist:152, tgt:[0,-32.4,17]},
  {id:'05_laser', nodes:['mock_laser'], ghost:['optical_head'],
                  az:-92, el:22, dist:150, tgt:[0,-32.4,22]},
  {id:'06_camera',nodes:['mock_camera'], ghost:['optical_head'],
                  az:16,  el:20, dist:150, tgt:[4,-32.4,18]},
  {id:'07_head',  nodes:[], solidify:['optical_head'],
                  az:-58, el:30, dist:175, tgt:[0,-32.4,20]},
  {id:'08_ribbon',nodes:['mock_csi_ribbon'],    az:-28, el:44, dist:230, tgt:[8,-10,22]},
  {id:'09_tube',  nodes:['aperture_tube'],      az:-58, el:20, dist:140, tgt:[0,-32.4,16]},
  {id:'10_as7341',nodes:['sensor_deck','mock_as7341','sensor_carrier'], az:-58, el:24, dist:160, tgt:[0,-32.4,38]},
  {id:'11_touch', nodes:['touch_collar','mock_touch_leds'], az:-58, el:20, dist:155, tgt:[0,-32.4,45]},
  {id:'12_cartridge',nodes:['mock_cartridge'],  az:-108,el:16, dist:200, tgt:[0,-50,12]},
  {id:'13_close', nodes:['mock_oled','mock_touch_window','shell_upper','oled_bezel'],
                                                az:-58, el:36, dist:275, tgt:[0,-6,30]},
  {id:'14_exploded',nodes:[],                   az:-58, el:20, dist:300, tgt:[0,-6,26], orbit:150},
];

function place(az, el, dist, tgt){
  const a = az*Math.PI/180, e = el*Math.PI/180;
  camera.position.set(tgt[0]+dist*Math.cos(e)*Math.cos(a),
                      tgt[1]+dist*Math.cos(e)*Math.sin(a),
                      tgt[2]+dist*Math.sin(e));
  camera.lookAt(tgt[0], tgt[1], tgt[2]);
}

function seek(t){
  // --- title ---------------------------------------------------------------
  const t0 = SEG[0];
  const titleEl = document.getElementById('title');
  if (t < t0.end){
    titleEl.style.opacity = 1;
    const k = t/t0.dur;
    document.getElementById('trule').style.width = `${ease(Math.min(1,k/0.35))*440}px`;
    document.getElementById('tsub').style.opacity = ease((k-0.28)/0.3);
  } else {
    titleEl.style.opacity = Math.max(0, 1-(t-t0.end)/0.6);
    titleEl.style.pointerEvents = 'none';
  }

  // --- parts ---------------------------------------------------------------
  for (const s of MAN.steps){
    const o = parts.get(s.node); if (!o) continue;
    const seg = SEG.find(g => g.nodes.includes(s.node));
    if (!seg){ o.visible = false; continue; }
    const i = seg.nodes.indexOf(s.node);
    // stagger within the segment, then fly in over 55% of the remaining time
    const lead = 0.10 + i*0.16, span = 0.52;
    const k = ease((( t - seg.start)/seg.dur - lead) / span);
    o.visible = t >= seg.start + lead*seg.dur*0.5;
    const d = (1-k) * s.dist;
    o.position.set(s.vec[0]*d, s.vec[1]*d, s.vec[2]*d);
    if (o.userData.mat){
      let target = o.userData.alpha * (0.15 + 0.85*k);
      // A node listed as `ghost` stays translucent until the segment that
      // solidifies it. The head is on screen while the emitters go into it --
      // that is the real build order -- but it should read as a shell you are
      // looking THROUGH until it seats.
      const gi = SEG.findIndex(g => (g.ghost||[]).includes(s.node));
      const si2 = SEG.findIndex(g => (g.solidify||[]).includes(s.node));
      if (gi >= 0){
        if (si2 >= 0 && t >= SEG[si2].start){
          const kk = ease(Math.min(1,(t-SEG[si2].start)/Math.min(1.6, SEG[si2].dur*0.5)));
          target = lerp(0.30, 1.0, kk);
        } else { target = 0.30; }
      }
      o.userData.mat.opacity = target;
      o.userData.mat.transparent = target < 0.999;
    }
  }

  // --- camera --------------------------------------------------------------
  let si = SEG.findIndex(g => t < g.end); if (si < 0) si = SEG.length-1;
  const cur = SEG[si], prv = SEG[Math.max(0, si-1)];
  const k = easeIO(Math.min(1, (t-cur.start)/Math.min(1.5, cur.dur*0.45)));
  const p = PLAN[si], q = PLAN[Math.max(0, si-1)];
  let az = lerp(q.az, p.az, k), el = lerp(q.el, p.el, k),
      dist = lerp(q.dist, p.dist, k);
  const tgt = [0,1,2].map(i => lerp(q.tgt[i], p.tgt[i], k));
  // gentle drift so a held shot is never dead, plus the closing orbit
  az += Math.sin((t-cur.start)*0.25) * 2.5;
  if (p.orbit) az = p.az + ((t-cur.start)/cur.dur) * p.orbit;
  place(az, el, dist, tgt);

  // --- caption -------------------------------------------------------------
  const card = document.getElementById('card'), cnt = document.getElementById('count');
  // name the part actually being fitted -- a ghosted node is scenery for this
  // segment, not its subject
  const lead = (cur.nodes || []).find(n => !(cur.ghost||[]).includes(n))
               || (cur.solidify||[])[0];
  const step = MAN.steps.find(s => s.node === lead);
  if (step && si > 0 && si < SEG.length-1){
    const kk = ease(Math.min(1,(t-cur.start)/0.5));
    const out = Math.max(0, 1-(t-(cur.end-0.5))/0.5);
    card.style.opacity = kk*out;
    card.style.transform = `translateY(${(1-kk)*22}px)`;
    document.getElementById('part').textContent = step.label;
    document.getElementById('detail').textContent = step.detail;
    cnt.style.opacity = kk*out*0.9;
    cnt.textContent = `${String(si).padStart(2,'0')} / ${String(SEG.length-2).padStart(2,'0')}`;
  } else { card.style.opacity = 0; cnt.style.opacity = 0; }

  renderer.render(scene, camera);
}

(async function(){
  MAN = await (await fetch('../out/glb/assembly.json')).json();
  const script = await (await fetch('./assembly-script.json')).json();
  let t = 0;
  SEG = PLAN.map(p => {
    const rec = script.find(s => s.id === p.id);
    const dur = (rec ? rec.duration : 6) + 0.45;
    const g = {...p, start: t, dur, end: t+dur};
    t += dur; return g;
  });
  TOTAL = t;

  const g = await new GLTFLoader().loadAsync('../out/glb/assembly_anim.glb');
  const found = [];
  g.scene.traverse(o => { if (o.isMesh) found.push(o); });
  for (const o of found){
    o.material.side = THREE.DoubleSide;
    o.material.flatShading = true;
    o.userData.mat = o.material;
    o.userData.alpha = o.material.opacity ?? 1;
    o.visible = false;
    root.add(o);
    parts.set(o.name, o);
  }
  // Real-time playback for capture. The clock is the page's own, so the
  // recording is a genuine render of the timeline rather than a frame dump.
  let raf = null;
  function play(){
    const t0 = performance.now();
    return new Promise(res => {
      (function step(){
        const t = (performance.now() - t0) / 1000;
        if (t >= TOTAL){ seek(TOTAL); res(TOTAL); return; }
        seek(t);
        raf = requestAnimationFrame(step);
      })();
    });
  }
  window.__anim = {seek, play, total: TOTAL, segments: SEG,
                   ready: true, nodes: [...parts.keys()]};
  seek(0);
})();
</script>
</body>
</html>
